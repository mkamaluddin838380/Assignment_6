<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body{background-color: rgb(0, 149, 255);}

        div{border: 5px solid rgb(0, 195, 255);
             background-color: rgb(5, 23, 90);
             margin: 20px 300px 0px 300px;
             padding: 30px;}

        h1{color: white;
           font-family: Arial, Helvetica, sans-serif;
           font-size: 40px;
           line-height: 0px;}

        p{color: white;
          text-align: center;
          margin: 0px 120px 30px 160px;}

        input{color: rgb(0, 195, 255);
              background-color: rgb(5, 23, 90);
              border: none;
              border-bottom: 2px solid ;
              display: block;
              margin: 70px 80px 50px 50px;
              width: 550px;
              padding-bottom: 10px;}  

       button{color: white;
              border: 2px solid white;
              background-color: rgb(5, 23, 90);
              margin-bottom: 60px;
              margin-top: 0px;
              width: 125px;
              height: 40px;}

    ::placeholder{color: rgb(0, 195, 255);}

    </style>

</head>
<body>

    <div>
        <h1><center>CONTACT US</center></h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore.</p>

        <form>
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Mail">
            <input type="text" placeholder="Your Message">
            <center><button>SUBMIT →</button></center>
        </form>
    </div>
    
</body>
</html>
